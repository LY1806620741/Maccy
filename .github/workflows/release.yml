name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test-and-build:
    name: Test & Build & Release
    runs-on: macos-15
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Version
        id: extract-version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - name: Run Tests
        run: |
          xcodebuild test \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination 'platform=macOS,arch=arm64' \
            -testPlan Maccy \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Build Output
        run: |
          APP_PATH="build/Build/Products/Release/Maccy.app"
          if [ -d "$APP_PATH" ]; then
            echo "✅ Build succeeded: $APP_PATH"
            ls -la "$APP_PATH"/Contents/
          else
            echo "❌ Build output not found at $APP_PATH"
            echo "Searching for built products..."
            find build -name "Maccy.app" -type d 2>/dev/null || echo "Not found"
            exit 1
          fi

      - name: Generate Screenshot
        run: |
          cd scripts
          swiftc generate_screenshot.swift -o generate_screenshot 2>&1
          if [ $? -eq 0 ]; then
            ./generate_screenshot sensitive-words-settings.png
            if [ -f sensitive-words-settings.png ]; then
              echo "✅ Screenshot generated successfully"
              ls -la sensitive-words-settings.png
              mkdir -p ../build/screenshots
              cp sensitive-words-settings.png ../build/screenshots/
            else
              echo "⚠️ Screenshot generation produced no output file"
            fi
          else
            echo "⚠️ Screenshot script compilation failed, skipping"
          fi
          cd ..

      - name: Package App
        run: |
          APP_PATH="build/Build/Products/Release/Maccy.app"
          cd build/Build/Products/Release
          zip -r Maccy.app.zip Maccy.app
          ls -la Maccy.app.zip
          mkdir -p ../../dist
          cp Maccy.app.zip ../../dist/
          cd ../../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/dist/Maccy.app.zip
            build/screenshots/sensitive-words-settings.png
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Maccy v${{ steps.extract-version.outputs.version }}
          body: |
            ## 🎉 Maccy 敏感词脱敏增强版 v${{ steps.extract-version.outputs.version }}

            ### ✨ 新增功能

            - 🔒 **自动编码脱敏**：Base64 编码格式（`__MACCY_B64_<编码>__`），可完全还原
            - ⚠️ **星号掩码**：`p**d` 格式，视觉隐藏不可还原
            - 🔄 **双向同步**：粘贴到敏感页面自动脱敏，复制回来自动还原
            - 🎯 **自定义替换词**：每个敏感词可指定专属替换文本
            - 🌐 **多应用支持**：Chrome、Edge、Brave、Arc、Codex、Cursor、VS Code、iTerm2、Figma
            - 🤖 **AI 页面预设**：一键加载 13 个主流 AI Chat 网页（ChatGPT、Claude、Gemini、Perplexity 等）
            - 🇨🇳 **多语言支持**：支持 50+ 种语言本地化

            ### 📦 安装方式

            1. 下载 `Maccy.app.zip`
            2. 解压后拖入 `/Applications/` 文件夹
            3. 首次运行时在「系统设置 → 隐私与安全性」中授权辅助功能权限

            ### 🖥️ 系统要求

            - macOS 14.0 (Sonoma) 或更高版本
            - Apple Silicon 或 Intel 处理器

            ### 🔐 隐私说明

            所有敏感词处理均在本地完成，不会上传到任何服务器。
          files: |
            build/dist/Maccy.app.zip
            build/screenshots/sensitive-words-settings.png
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
